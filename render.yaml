# Render — deploy sekali klik dari repo GitHub.
# Cara pakai: Render Dashboard → New → Blueprint → pilih repo ini.
services:
  - type: web
    name: kaskita
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    # Isi value-nya di dashboard Render (Environment), JANGAN tulis password di sini.
    # Nama key mengikuti .env.example (DB_*).
    envVars:
      - key: DB_HOST
        value: db.xxxxx.supabase.co
      - key: DB_PORT
        value: 6543
      - key: DB_NAME
        value: postgres
      - key: DB_USER
        value: postgres.xxxxx
      - key: DB_PASSWORD
        sync: false
