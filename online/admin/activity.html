<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aktivitas — KasKita</title>
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/responsive.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="app">
  <button class="nav-toggle" id="navToggle"><span></span><span></span><span></span></button>
  <div class="scrim" id="scrim"></div>
  <aside class="sidebar" id="sidebar">
    <a class="brand" href="dashboard.html"><span class="brand-mark">K</span><span class="brand-text"><strong>KasKita</strong><small>Sistem Kas &amp; Pembuatan Baju</small></span></a>
    <nav class="side-nav">
      <a href="dashboard.html">Dashboard</a><a href="payments.html">Kas &amp; Pembayaran</a>
      <a href="participants.html">Peserta</a><a href="shirts.html">Baju Gabungan</a>
      <a href="activity.html" class="on">Aktivitas</a><a href="users.html" class="only-super">Kelola Admin</a>
    </nav>
    <div class="side-user"><div class="avatar">A</div>
      <div class="who"><strong data-user-name>…</strong><small><span data-user-role>…</span> · <span data-user-mail></span></small></div>
      <button class="btn btn-ghost btn-sm" data-logout>Keluar</button></div>
  </aside>
  <div class="main">
    <header class="topbar"><div class="topbar-title"><h1>Aktivitas Admin</h1><p>Jelas siapa memasukkan / mengubah / menghapus data.</p></div>
      <div class="topbar-meta"><span class="role-badge" data-user-role>…</span><span class="clock" id="clock"></span></div></header>
    <main class="content" id="toasts">
      <div class="panel"><div class="panel-head"><h2>Riwayat Aktivitas</h2><span class="spacer"></span>
          <input type="text" id="q" placeholder="Cari aktivitas / admin…" style="margin:0;max-width:240px"></div>
        <div class="table-wrap"><table class="grid"><thead><tr><th>Waktu</th><th>Admin</th><th>Aksi</th><th>Aktivitas</th></tr></thead><tbody id="body"><tr><td colspan="4" class="empty">Memuat…</td></tr></tbody></table></div>
      </div>
    </main>
    <footer class="foot">KasKita · Data live dari Supabase</footer>
  </div>
</div>
<div class="modal-backdrop" id="modalBackdrop"><div class="modal"><div class="modal-head"><h3 id="modalTitle">Detail</h3><button class="icon-btn" data-close-modal>✕</button></div><div class="modal-body" id="modalBody"></div></div></div>
<script src="../js/config.js"></script>
<script src="../js/app.js"></script>
<script>
let DATA = [];
(async () => {
  if (!await guard(['admin', 'super_admin'])) return;
  const { data } = await sb.from('activity_logs').select('created_at, action, description, profiles(display_name)').order('created_at', { ascending: false }).limit(200);
  DATA = data || [];
  render();
})();
function render() {
  const q = document.getElementById('q').value.toLowerCase();
  const rows = DATA.filter((l) => (l.description + ' ' + l.action + ' ' + (l.profiles?.display_name || '')).toLowerCase().includes(q));
  document.getElementById('body').innerHTML = rows.length ? rows.map((l) =>
    '<tr><td style="white-space:nowrap">' + tglJam(l.created_at) + '</td><td>' + esc(l.profiles?.display_name || '—') + '</td><td><span class="badge info">' + esc(l.action) + '</span></td><td>' + esc(l.description) + '</td></tr>').join('')
    : '<tr><td colspan="4" class="empty">Belum ada aktivitas.</td></tr>';
}
document.getElementById('q').addEventListener('input', render);
</script>
</body>
</html>
