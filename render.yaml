# Render — deploy sekali klik dari repo GitHub.
# Cara pakai: Render Dashboard → New → Blueprint → pilih repo ini.
services:
  - type: web
    name: kaskita
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    # Isi value-nya di dashboard Render (Environment), JANGAN tulis password di file/repo.
    envVars:
      - key: DB_HOST
        value: aws-0-ap-southeast-1.pooler.supabase.com
      - key: DB_PORT
        value: 5432
      - key: DB_NAME
        value: postgres
      - key: DB_USER
        value: postgres.xxxxx
      - key: DB_PASSWORD
        sync: false
